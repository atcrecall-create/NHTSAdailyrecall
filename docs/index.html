<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle recall watch</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef1f4; --surface: #ffffff; --ink: #14202b; --muted: #55626f; --line: #d3dae1;
    --dnd: #b3261e; --on-dnd: #ffffff;
    --fire: #a24a05; --on-fire: #ffffff;
    --big: #1d5a94;
    --focus: #1d5a94;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161b; --surface: #19212a; --ink: #e7ecf0; --muted: #98a6b2; --line: #2c3842;
      --dnd: #ff8a80; --on-dnd: #2b0a07;
      --fire: #f2ad57; --on-fire: #2a1500;
      --big: #86bbea;
      --focus: #86bbea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  .status { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
  .status b { color: var(--ink); font-weight: 600; }

  .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .chip {
    appearance: none; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); border-radius: 6px;
    padding: 10px 12px; display: block;
  }
  .chip .n { display: block; font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .chip .t { display: block; font-size: 0.9rem; color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: currentColor; }
  .chip[aria-pressed="true"] .t { color: inherit; }
  .chip.dnd { color: var(--dnd); } .chip.fire { color: var(--fire); } .chip.big { color: var(--big); }
  .chip.dnd .n, .chip.fire .n, .chip.big .n { color: inherit; }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .tools input, .tools select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  .tools input { flex: 1 1 240px; }

  .day { font-size: 0.95rem; font-weight: 600; color: var(--muted); margin: 22px 0 8px; }
  .row {
    background: var(--surface); border: 1px solid var(--line); border-left-width: 6px;
    border-radius: 6px; margin-bottom: 8px; padding: 12px 14px;
  }
  .row.sev-dnd { border-left-color: var(--dnd); }
  .row.sev-fire { border-left-color: var(--fire); }
  .row.sev-big { border-left-color: var(--big); }
  .top { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; }
  .title { font-weight: 650; font-size: 1.05rem; margin: 0; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 2px 0 0; }
  .meta a { color: inherit; }
  .count { text-align: right; flex: none; }
  .count b { display: block; font-size: 1.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .count span { font-size: 0.8rem; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 0.8rem; font-weight: 600; padding: 1px 8px; border-radius: 4px; border: 1px solid transparent; }
  .tag.dnd { background: var(--dnd); color: var(--on-dnd); }
  .tag.fire { background: var(--fire); color: var(--on-fire); }
  .tag.big { border-color: var(--big); color: var(--big); }
  .tag.posted { border-color: var(--line); color: var(--muted); font-weight: 500; }
  .tag.posted.fresh { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
  .incidents { margin-top: 8px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px;
    font-size: 0.9rem; display: flex; gap: 6px 20px; flex-wrap: wrap; }
  .incidents b { font-variant-numeric: tabular-nums; margin-left: 4px; }
  .incidents .zero { color: var(--muted); }
  .incidents .deadly b { color: var(--dnd); }
  .incidents.none { color: var(--muted); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  details p { margin: 8px 0 0; max-width: 70ch; font-size: 0.95rem; }
  details p b { font-weight: 600; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 28px; text-align: center; color: var(--muted); }
  .empty button { font: inherit; margin-top: 8px; cursor: pointer; }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
  @media (max-width: 560px) {
    .filters { grid-template-columns: 1fr; }
    .top { flex-direction: column; gap: 6px; }
    .count { text-align: left; }
    .count b, .count span { display: inline; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vehicle recall watch</h1>
  <p class="status" id="status"></p>

  <div class="filters" role="group" aria-label="Filter by reason">
    <button class="chip dnd" data-flag="dnd" aria-pressed="false"><span class="n" id="n-dnd">0</span><span class="t">Do not drive</span></button>
    <button class="chip fire" data-flag="fire" aria-pressed="false"><span class="n" id="n-fire">0</span><span class="t">Fire risk</span></button>
    <button class="chip big" data-flag="big" aria-pressed="false"><span class="n" id="n-big">0</span><span class="t" id="t-big">Large recalls</span></button>
  </div>

  <div class="tools">
    <input id="q" type="search" placeholder="Search make, model, or component" aria-label="Search recalls">
    <select id="sort" aria-label="Sort recalls">
      <option value="new">Newest first</option>
      <option value="count">Most vehicles</option>
      <option value="severity">Most severe</option>
    </select>
  </div>

  <div id="list"></div>

  <footer>
    Source: <a href="https://www.nhtsa.gov/recalls">NHTSA recall data</a>, checked daily.
    Raw data: <a href="recalls.json">recalls.json</a>.
    Confirm any recall on nhtsa.gov before acting on it.
  </footer>
</div>

<script>
const DATA = {"generated": "2026-10-22T15:48:37Z", "today": "2026-10-22", "threshold": 50000, "recalls": [{"campno": "26V685000", "make": "SUBARU", "models": ["CROSSTREK", "FORESTER"], "years": "2026", "component": "SUSPENSION:FRONT:CONTROL ARM:LOWER BALL JOINT", "manufacturer": "Subaru of America, Inc.", "potaff": 8, "received": "2026-10-19", "first_seen": "2026-10-22", "defect": "Subaru of America, Inc. (Subaru) is recalling certain 2026 Crosstrek and Forester vehicles. The castle nut on the left-front lower control arm ball joint may be improperly fastened, which can lead to the ball joint separating from the lower control arm. ", "consequence": "A ball joint that separates from the lower control arm can cause a loss of vehicle control, increasing the risk of a crash.", "remedy": "Owners are advised not to drive their vehicle until the remedy is completed. Dealers will inspect and replace the left-front lower control arm ball joint assembly, as necessary, free of charge. Owner notification letters are expected to be mailed December 16, 2026.  Owners may contact Subaru customer service at 1-844-373-6614.  Subaru's number for this recall is WRI26.", "flags": ["dnd"], "posted": "2026-10-20", "incidents": {}}, {"campno": "26V682000", "make": "PORSCHE", "models": ["718 CAYMAN GT4 RS", "718 SPYDER RS", "911", "911 CARRERA GTS", "911 GT3", "911 GT3 RS", "911 TURBO", "911 TURBO S"], "years": "2024", "component": "WHEELS:LUGS/NUTS/BOLTS/STUDS", "manufacturer": "Porsche Cars North America, Inc.", "potaff": 548, "received": "2026-10-16", "first_seen": "2026-10-22", "defect": "Porsche Cars North America, Inc. (Porsche) is recalling certain 2024 718 Cayman GT4 RS, 911 Turbo S, 911 Turbo, 911 S/T, 911 GT3 RS, 911 GT3, 911 Carrera GTS, and 718 Spyder RS vehicles. The center lock wheel bolt may fracture and cause the wheel to detach.", "consequence": "Wheel detachment can result in a loss of vehicle control, increasing the risk of a crash.", "remedy": "Owners are advised not to drive their vehicles until they have been repaired. Dealers will check the center lock wheel fastening system and replace any incorrectly manufactured parts, as necessary, free of charge. Owner notification letters are expected to be mailed December 15, 2026. Owners may contact Porsche customer service at 1-800-767-7243. Porsche's number for this recall is ATA1. This recall expands previous NHTSA recall number 24V809. Vehicle Identification Numbers (VINs) involved in this recall became searchable on NHTSA.gov on October 20, 2026.", "flags": ["dnd"], "posted": "2026-10-19", "incidents": {}}, {"campno": "26V673000", "make": "TOYOTA", "models": ["LAND CRUISER HYBRID"], "years": "2024–2027", "component": "FUEL SYSTEM, GASOLINE:DELIVERY:HOSES, LINES/PIPING, AND FITTINGS", "manufacturer": "Toyota Motor Engineering & Manufacturing", "potaff": 105794, "received": "2026-10-14", "first_seen": "2026-10-22", "defect": "Toyota Motor Engineering & Manufacturing (Toyota) is recalling certain 2024-2027 Toyota Land Cruiser Hybrid vehicles. The fuel tube connection near the fuel tank may disconnect and leak fuel.", "consequence": "A fuel leak in the presence of an ignition source can increase the risk of a fire. ", "remedy": "Dealers will inspect the connection and install a supplemental clamp or, as necessary, replace the resin fuel tube and install a supplemental clamp, free of charge. Owner notification letters are expected to be mailed November 29, 2026. Owners may contact Toyota's customer service at 1-800-331-4331. Toyota's numbers for this recall are 26TB23 and 26TA23.", "flags": ["fire", "big"], "posted": "2026-10-14", "incidents": {}}, {"campno": "26V664000", "make": "GENESIS", "models": ["G80", "GENESIS"], "years": "2015–2020", "component": "SEATS:FRONT ASSEMBLY:POWER ADJUST", "manufacturer": "Hyundai Motor America", "potaff": 94622, "received": "2026-10-08", "first_seen": "2026-10-22", "defect": "Hyundai Motor America (Genesis) is recalling certain 2015-2016 Hyundai Genesis, and 2017-2020 Genesis G80 vehicles. The front power seat motors may overheat due to a stuck power seat control switch, which can result in a fire while parked or driving. ", "consequence": "A fire increases the risk of injury.", "remedy": "Owners are advised to park their vehicles outdoors and away from other vehicles or structures until the repair has been performed. The remedy is currently under development. Owner notification letters are expected to be mailed December 7, 2026. Owners of Hyundai vehicles may contact Hyundai customer service at 1-855-371-9460. Genesis owners may contact Genesis customer service at 844-340-9741. Hyundai recall number for this recall is 308 and Genesis' recall number is 035G. Vehicle Identification Numbers (VINs) involved in this recall became searchable on NHTSA.gov beginning October 13, 2026.", "flags": ["fire", "big"], "posted": "2026-10-09", "incidents": {}}, {"campno": "26V630000", "make": "VOLKSWAGEN", "models": ["ID.4"], "years": "2023–2026", "component": "ELECTRICAL SYSTEM:PROPULSION SYSTEM:TRACTION BATTERY", "manufacturer": "Volkswagen Group of America, Inc.", "potaff": 22524, "received": "2026-09-30", "first_seen": "2026-10-22", "defect": "Volkswagen Group of America, Inc. (Volkswagen) is recalling certain 2023-2026 ID.4 vehicles. The high voltage battery may fail and lead to a vehicle fire.", "consequence": "A vehicle fire increases the risk of injury.", "remedy": "Owners are advised to only charge their vehicles to a maximum of 80% battery capacity until the repair has been completed. The remedy is currently under development. Interim letters, notifying owners of the safety risk, are expected to be mailed November 27, 2026. Additional letters will be sent once the remedy is available. Owners may contact Volkswagen customer service at 1-800-893-5298. Volkswagen's number for this recall is 93EX. Vehicle Identification Numbers (VINs) involved in this recall became searchable on NHTSA.gov on October 6, 2026.  ", "flags": ["fire"], "posted": "2026-10-01", "incidents": {}}, {"campno": "26V621000", "make": "RAM", "models": ["PROMASTER", "PROMASTER BEV"], "years": "2022–2026", "component": "STEERING:ELECTRIC POWER ASSIST SYSTEM", "manufacturer": "Chrysler (FCA US, LLC)", "potaff": 265512, "received": "2026-09-29", "first_seen": "2026-10-22", "defect": "Chrysler (FCA US, LLC) is recalling certain 2022-2026 Ram 1500 Promaster, Ram 2500 Promaster, Ram 3500 Promaster, and 2024-2026 Ram 3500 Electric (EV) vehicles. Water may enter the electric power steering wiring harness, which can disable power steering assist.", "consequence": "A loss of power steering assist can increase the risk of a crash.", "remedy": "Dealers will inspect and replace the wiring harness and electronic power steering gear, as necessary, free of charge. Interim notification letters, notifying owners of the safety risk, are expected to be mailed November 17, 2026. Additional letters will be sent once the final remedy is available. Owners may contact Chrysler customer service at 800-853-1403. Chrysler's number for this recall is 92D. Vehicle Identification Numbers (VINs) involved in this recall will became searchable on NHTSA.gov on October 6, 2026.", "flags": ["big"], "posted": "2026-09-29", "incidents": {}}]};
const fmt = new Intl.NumberFormat("en-US");
const state = { flags: new Set(), q: "", sort: "new" };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function dayLabel(iso) {
  if (!iso) return "Unknown date";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}
function postedOf(r) { return r.posted || r.received || r.first_seen; }
function shortDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
function sev(r) { return r.flags.includes("dnd") ? 3 : r.flags.includes("fire") ? 2 : 1; }
function topFlag(r) { return r.flags.includes("dnd") ? "dnd" : r.flags.includes("fire") ? "fire" : "big"; }
const TAG_TEXT = { dnd: "Do not drive", fire: "Fire risk", big: "Over " + fmt.format(DATA.threshold) + " vehicles" };

function buildRow(r) {
  const row = el("article", "row sev-" + topFlag(r));
  const top = el("div", "top");
  const left = el("div");
  const models = r.models.length > 4 ? r.models.slice(0, 4).join(", ") + " and " + (r.models.length - 4) + " more" : r.models.join(", ");
  left.append(el("h3", "title", [r.make, models, r.years ? "(" + r.years + ")" : ""].filter(Boolean).join(" ")));
  const meta = el("p", "meta");
  const a = el("a", null, "Campaign " + r.campno);
  a.href = "https://www.nhtsa.gov/recalls?nhtsaId=" + encodeURIComponent(r.campno);
  a.target = "_blank"; a.rel = "noopener";
  meta.append(a, document.createTextNode(" \u2013 " + (r.component || "Component not listed") + (r.received ? ", reported " + r.received : "")));
  left.append(meta);
  const count = el("div", "count");
  count.append(el("b", null, fmt.format(r.potaff)), el("span", null, "vehicles affected"));
  top.append(left, count);
  row.append(top);

  const tags = el("div", "tags");
  r.flags.forEach(f => tags.append(el("span", "tag " + f, TAG_TEXT[f])));
  tags.append(el("span", "tag posted" + (r.first_seen === DATA.today ? " fresh" : ""), "Posted " + shortDate(postedOf(r))));
  row.append(tags);

  const inc = r.incidents || {};
  const labels = [["injuries", "Injuries"], ["crashes", "Crashes"], ["fatalities", "Fatalities"], ["fires", "Fires"], ["property_damage", "Property damage"]];
  const found = labels.filter(([k]) => k in inc);
  const box = el("div", "incidents" + (found.length ? "" : " none"));
  if (found.length) {
    found.forEach(([k, label]) => {
      const item = el("span", inc[k] === 0 ? "zero" : (k === "fatalities" ? "deadly" : ""));
      item.append(document.createTextNode(label), el("b", null, fmt.format(inc[k])));
      box.append(item);
    });
  } else {
    box.textContent = "No injury, crash, fatality, fire or property damage counts in the recall text";
  }
  row.append(box);

  const det = el("details");
  det.append(el("summary", null, "What\u2019s wrong and what to do"));
  [["Defect", r.defect], ["Risk", r.consequence], ["Remedy", r.remedy]].forEach(([k, v]) => {
    if (!v) return;
    const p = el("p"); p.append(el("b", null, k + ": "), document.createTextNode(v)); det.append(p);
  });
  row.append(det);
  return row;
}

function render() {
  const q = state.q.trim().toLowerCase();
  let items = DATA.recalls.filter(r =>
    (state.flags.size === 0 || r.flags.some(f => state.flags.has(f))) &&
    (!q || (r.make + " " + r.models.join(" ") + " " + r.component + " " + r.manufacturer).toLowerCase().includes(q)));
  const cmp = {
    new: (a, b) => postedOf(b).localeCompare(postedOf(a)) || b.received.localeCompare(a.received),
    count: (a, b) => b.potaff - a.potaff,
    severity: (a, b) => sev(b) - sev(a) || b.potaff - a.potaff,
  }[state.sort];
  items.sort(cmp);

  const list = document.getElementById("list");
  list.replaceChildren();
  if (!items.length) {
    const e = el("div", "empty", DATA.recalls.length ? "No recalls match these filters." : "No flagged recalls yet. Check back after the next daily run.");
    if (DATA.recalls.length) {
      const b = el("button", null, "Clear filters");
      b.onclick = () => { state.flags.clear(); state.q = ""; document.getElementById("q").value = ""; sync(); };
      e.append(document.createElement("br"), b);
    }
    list.append(e); return;
  }
  let lastDay = null;
  items.forEach(r => {
    if (state.sort === "new" && postedOf(r) !== lastDay) {
      lastDay = postedOf(r);
      const n = items.filter(x => postedOf(x) === lastDay).length;
      list.append(el("h2", "day", dayLabel(lastDay) + " \u2013 " + n + (n === 1 ? " recall" : " recalls")));
    }
    list.append(buildRow(r));
  });
}

function sync() {
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", state.flags.has(c.dataset.flag)));
  render();
}

(function init() {
  ["dnd", "fire", "big"].forEach(f => {
    document.getElementById("n-" + f).textContent = DATA.recalls.filter(r => r.flags.includes(f)).length;
  });
  document.getElementById("t-big").textContent = "Over " + fmt.format(DATA.threshold) + " vehicles";
  const todayN = DATA.recalls.filter(r => r.first_seen === DATA.today).length;
  const when = new Date(DATA.generated).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
  const s = document.getElementById("status");
  s.append("Last checked ", el("b", null, when), ". ", el("b", null, todayN + " new"), " flagged since the last check.");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const f = c.dataset.flag; state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f); sync();
  });
  document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
  document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
  sync();
})();
</script>
</body>
</html>
